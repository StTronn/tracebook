[project]
name = "harbor-spider2-lite-adapter"
version = "0.1.0"
description = "Harbor adapter for Spider2-lite (local SQLite subset)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2"]  # generation imports compare.py (gold_paths) so gold resolution matches the grader

[project.scripts]
spider2-lite = "spider2_lite.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spider2_lite"
